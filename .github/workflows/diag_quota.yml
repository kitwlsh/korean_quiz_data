# 🔬 진단 — Gemini 「한도 초과(429)」가 **모델별인가 키 단위인가**
#
# 왜 있나 (2026-09-09)
#   로봇이 09-08부터 429로 죽는다. 한도 숫자가 하루 만에 20 → 5로 줄었고,
#   09-09 11:14 KST에는 퀴즈·지문이 **둘 다** 막혀 지문 공급이 2편에서 멈췄다.
#   고칠 방향이 셋인데 **어느 것이 맞는지는 실측 없이 정할 수 없다**:
#     ① 한도가 «모델별»이면  → 429에도 다음 모델로 폴백(앱 vc10 + 로봇)
#     ② 한도가 «키 단위»면    → 폴백은 무의미. 지금 동작이 맞다(08-25 판단 유지)
#     ③ 창이 «분 단위»면      → 앱은 그대로 두고 **로봇의 요청 간격만** 넓히면 된다
#   🔴 실측 없이 ①을 켜면 «한도가 그대로인데 모델만 계속 바꿔 태우는» 반대 사고가 된다.
#
# 1차 실행(09-09 14:17 KST)에서 안 것 — 로그에 남았다
#   A/B/C 세 모델 전부 200(로봇이 3시간 전 429로 죽은 그 별칭 포함) → **일일 한도가 아니다**
#   D 연속 호출에서 45초 안에 7~8번째가 429 → **짧은 창에 아주 작은 수**다
#   🔴 그런데 «그 순간 다른 모델은 되는가»(= 판단의 핵심)를 재기 직전에 스크립트가 죽었다
#
# 🔴 1차 실행이 죽은 이유 = 이 파일의 버그였다 (API 문제가 아니다)
#   GitHub Actions는 `run:`을 **`bash -e`**로 돌린다. 거기에 `pipefail`까지 켜 놓아서
#   **429가 처음 나온 순간** 안쪽 `grep`·`head` 파이프의 비정상 종료가 그대로 치명타가 됐다.
#   고친 것 셋:
#     1) `shell: bash {0}` — `-e`를 끈다(이 스크립트는 «실패해도 계속 재는» 것이 일이다)
#     2) `head -1` 파이프를 없앤다(SIGPIPE로 죽던 자리)
#     3) 결과 커밋 스텝에 `if: always()` — **스크립트가 죽어도 찍힌 데까지는 남긴다**
#
# 결과를 어디서 보나
#   ① Actions 로그, ② **`diag_quota_result.txt`로 커밋한다**(매 실행 덮어쓴다).
#   ②가 있어야 개발 기기에서 `git pull`만으로 결과를 읽는다(이 기기에는 gh CLI가 없다).
#
# ⚠️ 무료 한도를 **20번 남짓 소모한다.** 같은 키를 앱에서도 쓰고 있다면 잠깐 AI가 막힐 수 있다
#    (1차 실측대로 창이 분 단위라면 1분 안에 풀린다).
# 🟢 데이터 파일(`*.json`)은 건드리지 않는다 — 만드는 것은 결과 텍스트 하나뿐이다.
# 📖 배경·판독법 = KDailyUtil/doc/AI_KEY_NOTES.md §3-2

name: 🔬 진단 — Gemini 429 한도 실측

on:
  workflow_dispatch: # 손으로 돌린다 (Actions 탭 → Run workflow)
  push:
    paths:
      - '.github/workflows/diag_quota.yml' # 이 파일을 고쳐 올리면 그 자리에서 한 번 돈다

jobs:
  probe:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 결과 텍스트 한 개를 커밋하기 위해서만 필요하다

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 한도 실측 (상태 코드만 찍는다 · 키는 찍지 않는다)
        # 🔴 기본값(`bash -e`)을 쓰지 않는다 — 429는 이 스크립트에게 «오류»가 아니라 «측정값»이다.
        shell: bash {0}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -u

          ALIAS="gemini-flash-latest"
          M1="gemini-3.5-flash"
          M2="gemini-3.6-flash"

          # 🔴 혹시라도 본문에 키가 섞여 나오면 가린다 (로그·커밋은 공개될 수 있다)
          scrub() { sed -e 's/AIza[0-9A-Za-z_-]\{10,\}/<KEY-가려짐>/g'; }

          # 호출하고 HTTP 코드를 전역 LAST_CODE에 담는다.
          # 🔴 파이프를 쓰지 않는다 — 1차 실행이 head -1 파이프에서 죽었다.
          # 🔴 키는 URL이 아니라 헤더로 보낸다 — URL은 로그·중계에 남기 쉽다.
          call() {
            m="$1"
            LAST_CODE=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d '{"contents":[{"parts":[{"text":"OK"}]}],"generationConfig":{"maxOutputTokens":1}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent" 2>/dev/null)
            [ -z "${LAST_CODE}" ] && LAST_CODE="000"
          }

          # 429일 때만 한도·재시도 정보를 덧붙인다.
          detail() {
            lim=$(grep -o 'limit: [0-9]*, model: [A-Za-z0-9.-]*' /tmp/body.json)
            rty=$(grep -o 'Please retry in [0-9.]*s' /tmp/body.json)
            [ -n "${lim}" ] && echo "      ${lim}"
            [ -n "${rty}" ] && echo "      ${rty}"
            if [ -z "${lim}" ] && [ -z "${rty}" ]; then
              echo "      $(head -c 200 /tmp/body.json | tr '\n' ' ' | scrub)"
            fi
            return 0
          }

          probe() {
            call "$1"
            echo "HTTP ${LAST_CODE}  <- $1"
            [ "${LAST_CODE}" != "200" ] && detail
            return 0
          }

          {
            echo "실행 시각(UTC): $(date -u '+%F %T')  = KST $(TZ=Asia/Seoul date '+%F %T')"
            echo

            echo "===== A. 별칭 ${ALIAS} — 로봇이 실제로 쓰는 것 ====="
            probe "${ALIAS}"
            echo
            echo "===== B. ${M1} ====="
            probe "${M1}"
            echo
            echo "===== C. ${M2} ====="
            probe "${M2}"
            echo

            echo "===== D. ${M1}을 429가 날 때까지 연달아 부른다 (1초 간격 · 최대 15회) ====="
            HIT=0
            for i in $(seq 1 15); do
              call "${M1}"
              echo "  ${i}회: HTTP ${LAST_CODE}"
              if [ "${LAST_CODE}" = "429" ]; then
                HIT="${i}"
                detail
                break
              fi
              sleep 1
            done
            if [ "${HIT}" = "0" ]; then
              echo "  → 15회를 다 부를 때까지 429가 나지 않았다(한도가 그새 넉넉해졌다)"
            else
              echo "  → ${HIT}회째에 429. 이 근처가 «짧은 창의 한도»다"
            fi
            echo

            echo "===== F. 🔴 결정적 시험 — ${M1}이 막힌 «바로 그 순간» 다른 모델은 되는가 ====="
            echo "      🔴 2026-09-14 수정: **교대로 던진다**(M1→M2→M1→M2→M1→M2)."
            echo "      09-09 1·2차는 대조군(M1)을 맨 끝에 둬서, 거기 닿을 때쯤 창이 이미 풀렸다."
            echo "      («다른 모델이라 됐다»와 «그새 풀려서 됐다»가 구분되지 않아 판정 불가였다)"
            if [ "${HIT}" = "0" ]; then
              echo "  (D에서 429를 못 만들어 이번엔 못 잰다)"
            else
              M1_CODES=""
              M2_CODES=""
              # 🔴 사이에 sleep을 넣지 않는다 — 기다리는 순간 대조군이 풀려 시험이 무의미해진다.
              for r in 1 2 3; do
                call "${M1}"
                M1_CODES="${M1_CODES} ${LAST_CODE}"
                echo "  ${r}회 · ${M1} (대조군): HTTP ${LAST_CODE}"
                [ "${LAST_CODE}" = "429" ] && detail
                call "${M2}"
                M2_CODES="${M2_CODES} ${LAST_CODE}"
                echo "  ${r}회 · ${M2}         : HTTP ${LAST_CODE}"
                [ "${LAST_CODE}" = "429" ] && detail
              done
              echo "  참고 · 별칭 ${ALIAS}:"
              probe "${ALIAS}"
              echo
              echo "  >> 요약  ${M1}(대조군) =${M1_CODES}"
              echo "  >>       ${M2}          =${M2_CODES}"
              case "${M1_CODES}" in
                *429*)
                  echo "  >> 대조군이 막힌 회차가 있다 — 그 회차의 ${M2} 값으로 판정한다(아래 판독법)"
                  ;;
                *)
                  echo "  >> ⚠️ 대조군이 한 번도 429가 아니다 = **창이 이미 풀렸다 → 이번 회차는 판정 불가**"
                  echo "  >>    D에서 429가 난 직후에 바로 여기까지 와야 한다. 다시 돌린다"
                  ;;
              esac
            fi
            echo

            echo "===== E. 65초 자고 ${M1} 재시도 — 창이 «분 단위»인가 ====="
            sleep 65
            probe "${M1}"
            echo

            cat <<'HOWTO'
          ===== 판독법 =====
          [F가 핵심 — 🔴 «같은 회차»끼리 짝지어 읽는다]
            대조군 M1이 429 인 회차에 M2가 200  -> 한도는 «모델별». 429에도 폴백하는 것이 맞다(앱 vc10 + 로봇)
            같은 회차에 M1·M2가 둘 다 429       -> «키 단위». 폴백은 헛수고다. 08-25 판단을 유지한다
            M1이 1회차부터 200                  -> 창이 그새 풀렸다 = **판정 불가**. 결론 내지 말고 다시 돌린다
            🔴 서로 다른 회차의 값을 짝지어 읽지 말 것 — 그 오류가 09-09 판정을 날렸다
          [D]
            N회째에 429                    -> 그 N이 «짧은 창의 한도». 로봇이 몰아 쳐서 걸린 것이다
          [E]
            200                            -> 창은 «분 단위». 로봇 요청 간격만 넓히면 로봇은 산다
            429                            -> 창이 길다(시간~하루). 폴백·안내 문구가 진짜 문제다
          🔴 어느 경우든 «안내 문구 수정»(«잠시 뒤 풀립니다»)은 결과와 무관하게 맞는 수정이다
          HOWTO
          } 2>&1 | tee diag_quota_result.txt

      # 🔴 always(): 위 스크립트가 죽어도 «찍힌 데까지»는 남긴다.
      #    1차 실행(09-09)에서 스크립트가 중간에 죽자 이 스텝이 통째로 건너뛰어져
      #    측정값이 Actions 로그에만 남고 저장소에는 하나도 안 남았다.
      - name: 결과 파일 커밋
        if: always()
        run: |
          git config --global user.name "Quiz Robot"
          git config --global user.email "robot@example.com"
          git add diag_quota_result.txt
          if git diff --cached --quiet; then
            echo "결과가 이전과 동일 — 커밋할 것이 없습니다."
          else
            git commit -m "🔬 진단: Gemini 429 한도 실측 결과"
            git push
          fi
